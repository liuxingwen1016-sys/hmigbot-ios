// 改编自真实工程 xiaoyibang app/build.gradle（去业务化）：三环境 BuildConfig 注入 +
// manifest 占位符（推送厂商 key）+ 应用 ID。flavor 段为改编附加（真实工程无 flavor）。

android {
    compileSdkVersion 33

    defaultConfig {
        applicationId "com.fixture.app"
        minSdkVersion 21
        targetSdkVersion 33
        multiDexEnabled true

        manifestPlaceholders = [
                app_name     : "@string/app_name",
                PUSH_APPKEY  : "cdef0000e2dfe10000c6549d",
                PUSH_CHANNEL : "developer-default",
                VENDOR_APPID : "101000000",
        ]
    }

    flavorDimensions "env"
    productFlavors {
        standard {
            dimension "env"
            buildConfigField "String", "CHANNEL_TAG", '"official"'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            buildConfigField "boolean", "IS_DEBUG", 'false'
            buildConfigField "String", "ENV_TAG", '"prod"'
            buildConfigField "String", "API_ENV", '"https://api.enrollhub.cn/"'
        }
        debug {
            debuggable true
            buildConfigField "boolean", "IS_DEBUG", 'true'
            buildConfigField "String", "ENV_TAG", '"dev"'
            buildConfigField "String", "API_ENV", '"http://stub-collegeserver.enrollhub-test.cn/"'
        }
    }
}
