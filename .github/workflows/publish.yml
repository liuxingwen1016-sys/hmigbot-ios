name: Publish main to hmigbot-lite-CodeX

# Codex 版复刻自 migbot 仓的 publish.yml，结构对齐，差异点：
#   - 无 `claude plugin validate`（本仓无 plugin.json）——清单校验由 validate.sh 承担
#   - runtime 仓为 migbot-codex-runtime-src（a2h 多调用二进制的源仓）
#   - 发布对象只有 fuxi-ailabs/hmigbot-lite-CodeX 的 migbot/ 子目录（无 artifacts 组织仓，
#     故 migbot 版的 release-notes 脱敏与 fuxi-artifacts 镜像整段不需要）
#   - 暂无 e2e 门禁：migbot-server 的 e2e.yml 目前 source_repo 只认
#     {migbot, migbot-server, migbot-runtime-src}，且 harness 为 claude-CLI 驱动；
#     待其支持 Codex 链路（hmigbot-CodeX + migbot-codex-runtime-src）后，
#     照 migbot publish.yml 的 e2e job 加回并让 publish 依赖它。

on:
  push:
    branches: [main]        # push to main runs tests only, no publish
    tags: ['v*']            # only version tags starting with "v" trigger a publish
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      mirror_tag:
        # 留空 = 只跑 test（dispatch 的原有行为）。填一个 v 开头的 tag = 补发
        # 该 tag 的 lite 镜像（publish-lite），用于镜像单独失败、而源仓 Release
        # 已经发好、不想重打 tag 的场合。刻意只驱动 publish-lite：源仓 Release
        # 由 publish job 负责，它仍然只认 tag push，手动补发不会动已发布的 Release。
        description: '补发 lite 镜像的 tag（如 v1.0.0）；留空则只跑 test'
        required: false
        default: ''

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # 手动补发时测的必须是待发布 tag 的代码，而不是 dispatch 所在的分支
          # ——否则 test 门禁测 A 、publish-lite 发 B，门禁就形同虚设。
          # 空值时 checkout 回落到触发的 ref，其余触发方式行为不变。
          ref: ${{ inputs.mirror_tag || github.ref }}

      - name: Static validation (validate.sh)
        # skill frontmatter 规范、agents-codex TOML、command->skill 转换件、
        # runtime 卫生（旧 a2h 残留 / 已退役 metrics 接口）、安装器 hooks 接线、
        # 双平台 wrapper 与 config-seed 关键键 —— 全部在 validate.sh 内。
        run: bash validate.sh

      - name: Component counts
        # `-eq` rather than `-ge`: an exact count is what catches a sync that
        # silently drops a component. The flip side is that adding components
        # is a deliberate bump here — 12 (initial) → 13 (a2h-closer) → 22 (the
        # nine arkts-* domain agents, whose dispatch wiring landed in 453a988)
        # → 31 (the arkts-ui-* / arkts-ut-* test-agent families, ArkTs-Core@1b3088d).
        run: |
          set -e
          agents=$(find agents-codex -maxdepth 1 -name '*.toml' | wc -l | tr -d ' ')
          skills=$(find skills -maxdepth 1 -mindepth 1 -type d | wc -l | tr -d ' ')
          echo "agents=$agents skills=$skills"
          [ "$agents" -eq 31 ] || { echo "expected 31 agents"; exit 1; }
          [ "$skills" -ge 90 ] || { echo "expected ≥90 skills"; exit 1; }

      - name: Telemetry (数据打点) present in pipeline skills
        # Guards against a pipeline-skill restructure silently dropping the
        # reporting steps — every stage must still invoke its a2h
        # command(s). Uploads ride the Codex lifecycle hooks; the hook wiring
        # (`a2h hook`) is asserted by validate.sh, so unlike migbot there
        # are no upload-* commands to check here.
        run: |
          set -u
          fail=0
          check() {
            if ! grep -qE "$2" "$1"; then
              echo "::error::MISSING telemetry — $3 ($1: /$2/)"
              fail=1
            else
              echo "ok: $3 ($1)"
            fi
          }
          check skills/a2h-spec/SKILL.md       'a2h mark-stage a2h-spec'       'spec: mark-stage'
          check skills/a2h-plan/SKILL.md       'a2h mark-stage a2h-plan'       'plan: mark-stage'
          check skills/a2h-execute/SKILL.md    'a2h mark-stage a2h-execute'    'execute: mark-stage'
          check skills/a2h-verify/SKILL.md     'a2h mark-stage a2h-verify'     'verify: mark-stage'
          check skills/a2h-verify/SKILL.md     'a2h count-lines'               'verify: count-lines (完成行数)'
          check skills/a2h-retrospect/SKILL.md 'a2h mark-stage a2h-retrospect' 'retrospect: mark-stage'
          check skills/a2h-retrospect/SKILL.md 'a2h count-lines'               'retrospect: count-lines'
          if [ "$fail" -ne 0 ]; then
            echo "::error::A telemetry reporting step was deleted from a pipeline skill. Restore it before merging."
            exit 1
          fi
          echo "All telemetry presence checks passed."

      - name: Required files present
        # validate.sh 已断言二进制/双平台 wrapper/安装器/config-seed；
        # 这里是它未覆盖的关键分发资产清单（对齐 migbot 的 required-files 步骤）。
        run: |
          set -e
          for f in \
            agents-codex/a2h-fixer.toml \
            agents-codex/visual-fixer.toml \
            agents-codex/a2h-activity-converter.toml \
            agents-codex/a2h-android-analyzer.toml \
            agents-codex/a2h-migration-worker.toml \
            skills/arkts-webview-manager/SKILL.md \
            skills/a2h-privacy/SKILL.md \
            skills/a2h-privacy-zh/SKILL.md \
            bin/a2h-tool \
            bin/a2h-bootstrap \
            bin/a2h-agreement \
            bin/a2h-linux-amd64 \
            bin/a2h-linux-arm64 \
            bin/a2h-darwin-amd64 \
            bin/a2h-darwin-arm64 \
            bin/a2h-windows-amd64.exe \
            bin/a2h-windows-arm64.exe \
            policies/user-experience-improvement-plan.en.md \
            policies/user-experience-improvement-plan.zh.md; do
            [ -e "$f" ] || { echo "MISSING: $f"; exit 1; }
          done
          echo "All required files present."

      - name: First-run provisioning smoke test (a2h-bootstrap)
        run: |
          set -e
          chmod +x bin/a2h-bootstrap bin/a2h-tool bin/a2h-agreement bin/a2h-*
          WORK="$(mktemp -d)"
          ( cd "$WORK" && PATH="$GITHUB_WORKSPACE/bin:$PATH" a2h-bootstrap --lang en >/tmp/boot.json )
          cat /tmp/boot.json
          # config skeleton with telemetry unset
          grep -q '"telemetry_consent": "unset"' "$WORK/.migbot/config.json"
          # runtime staged into the project: a2h-tool + the platform-matched
          # a2h raw-telemetry binary + policy docs
          for f in .migbot/bin/a2h-tool .migbot/bin/a2h \
                   .migbot/policies/user-experience-improvement-plan.en.md; do
            [ -e "$WORK/$f" ] || { echo "MISSING provisioned: $f"; exit 1; }
          done
          # the a2h binary is staged executable. Its wire vector is
          # covered by migbot-codex-runtime-src ci.
          [ -x "$WORK/.migbot/bin/a2h" ] || { echo "a2h runtime not staged/executable"; exit 1; }
          # idempotency: second run reports exists, does not error
          ( cd "$WORK" && PATH="$GITHUB_WORKSPACE/bin:$PATH" a2h-bootstrap --lang en | grep -q '"status":"exists"' )
          rm -rf "$WORK"
          echo "Provisioning smoke test OK."

  publish:
    needs: [test]
    # only publish on a "v" tag (tag push, or manual dispatch on a v tag)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write          # needed to create the Release on this (source) repo
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # 版本门禁:tag vX.Y.Z 必须等于清单文件里的 version,否则不建 Release。
      # (发行仓 / 资源包的版本号都从这里对齐;错位过:清单还是旧版就打了新 tag)
      - name: Version gate — tag matches manifest
        run: |
          set -euo pipefail
          TAG_VER="${GITHUB_REF_NAME#v}"
          V="$(python3 -c 'import json; print(json.load(open(".codex-plugin/plugin.json"))["version"])')"
          echo ".codex-plugin/plugin.json: $V"
          [ "$V" = "$TAG_VER" ] || { echo "::error::tag $GITHUB_REF_NAME 与 .codex-plugin/plugin.json 的 version=$V 不一致 —— 先 bump 版本文件再打 tag"; exit 1; }

      - name: Publish GitHub Release on this repo (full auto-generated notes)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          # This is the private source repo, so the full GitHub format is fine
          # here: "What's Changed" with PR titles, @authors, PR links and a
          # Full Changelog.
          gh release delete "$TAG" --repo "${{ github.repository }}" --yes 2>/dev/null || true
          gh release create "$TAG" --repo "${{ github.repository }}" \
            --title "$TAG" --generate-notes --verify-tag

  # Mirror into the migbot/ subdir of the fuxi-ailabs/hmigbot-lite-CodeX
  # monorepo. Independent of `publish`: both share the same test gate (which
  # runs ONCE and fans out), but this runs in its own runner so a failure here
  # does not block the source-repo Release, and it can be re-run on its own.
  # Same v-tag gating as publish. No `contents: write` needed — it pushes with
  # the LITE_CODEX_PAT secret and creates nothing on this source repo.
  publish-lite:
    needs: [test]
    # v tag push，或显式指定了 mirror_tag 的手动 dispatch。刻意不写成
    # `github.event_name == 'workflow_dispatch'`：那样在分支上空手 dispatch
    # 也会触发镜像，等于把 tag 闸门让了出去。要求填 tag 才跑，push/PR 两条
    # 路径仍然被完全挡住。
    if: startsWith(github.ref, 'refs/tags/v') || inputs.mirror_tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.mirror_tag || github.ref }}
          persist-credentials: false

      - name: Mirror main into migbot/ subdirectory of fuxi-ailabs/hmigbot-lite-CodeX
        env:
          # Repo secret is LITE_CODEX_PAT (the Codex-side token; hmigbot 仓那边才叫
          # LITE_PAT). Referencing a secret that does not exist yields an EMPTY
          # string, not an error — the clone below then authenticates with no
          # token and GitHub answers "Invalid username or token", which reads
          # like an expired PAT rather than a name typo. Hence the guard.
          LITE_PAT: ${{ secrets.LITE_CODEX_PAT }}
          MIRROR_TAG: ${{ inputs.mirror_tag }}
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE"
          # tag push 时取 GITHUB_REF_NAME；手动补发时取 mirror_tag——与上面
          # checkout 的 ref 同源，两者不会指向不同的代码。
          TAG="${MIRROR_TAG:-$GITHUB_REF_NAME}"      # the tag being released, e.g. v1.0.0
          LITE_REPO="fuxi-ailabs/hmigbot-lite-CodeX"
          SUBDIR="migbot"                            # target subdir inside the monorepo

          # TAG 会落进 lite 仓的 commit message，是分发仓回溯版本的唯一线索。
          # 挡住把分支名误填进 mirror_tag 的情况。
          case "$TAG" in
            v*) ;;
            *) echo "::error::mirror_tag must be a v-prefixed tag (got '$TAG')"; exit 1 ;;
          esac

          if [ -z "${LITE_PAT}" ]; then
            echo "::error::secrets.LITE_CODEX_PAT is empty or unset — cannot authenticate to ${LITE_REPO}. Set it in this repo's Actions secrets (needs push access to the lite monorepo), then re-run this job."
            exit 1
          fi

          # ---- clone the lite monorepo's main branch ----------------------------
          LITE=/tmp/hmigbot-lite-codex
          git clone -b main --single-branch \
            "https://x-access-token:${LITE_PAT}@github.com/${LITE_REPO}.git" \
            "$LITE"
          cd "$LITE"
          git config user.name  "fuxi-publish-bot"
          git config user.email "noreply@fuxi-ailabs"

          # ---- replace ONLY the migbot/ subtree ---------------------------------
          # hmigbot-lite-CodeX is a multi-project monorepo (distribution/, scripts/,
          # tests/, migbot-flutter/, migbot-rn/, migbot-uniapp/, …). Touch nothing
          # but migbot/. rm + recreate so files deleted upstream are reflected —
          # the subtree stays an exact mirror, not a union with stale files.
          rm -rf "$SUBDIR"
          mkdir -p "$SUBDIR"
          # 排除规则与该子目录现状逐字节核验一致（上游 ecd2ef7 处 1961 文件 blob
          # SHA 全同）：维护面（.github/、.claude/、.convert/）不进分发仓；
          # docs/ 随包分发（与 migbot 仓排除 docs/ 的做法不同，按仓策略保留）。
          rsync -a --exclude=.git \
            --exclude='.github/' \
            --exclude='.claude/' \
            --exclude='.convert/' \
            "$SRC/" "$SUBDIR/"

          git add -A
          if git diff --staged --quiet; then
            echo "No file changes; migbot/ subtree already up to date."
          else
            git commit -m "sync migbot ${TAG}"   # short; full notes live in the source-repo Release
            git push origin main
          fi
          echo "Synced migbot/ subtree to ${LITE_REPO}@main."
