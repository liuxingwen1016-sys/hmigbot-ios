| arkts-app-identity | 根据 iOS 源应用身份和已批准目标标识实现并核验 HarmonyOS 名称、图标、启动页、链接与权限；不复制源签名配置。 | .agents/skills/arkts-app-identity/SKILL.md |
| ios-resources-convert | 在 a2h-execute Stage 0 转换 iOS Asset Catalog、图片/颜色变体、字符串/复数、字体与应用身份输入；复用鸿蒙资源、国际化和身份校验，并记录不可直接转换资源。 | .agents/skills/ios-resources-convert/SKILL.md |
| arkts-i18n | ArkTS/HarmonyOS 国际化（i18n）技能（V2 优先，API 12+）。当用户需要添加多语言支持、实现动态语言切换、配置资源文件、处理国际化资源目录结构、扫描硬编码字符串，或任何与"国际化"、"多语言"、"切换语言"相关的问题时，务必触发此 skill。 即使用户只是说"怎么添加英文"或"怎么做中英文切换"，也应触发。 | .agents/skills/arkts-i18n/SKILL.md |

