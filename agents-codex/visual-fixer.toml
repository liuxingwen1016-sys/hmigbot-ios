## 2. 工作流程

### Step 1. 扫描 + group by page_id

```pseudocode
candidates_by_page = {}     # ui 通道：page_id → [(f, fm), ...]
feat_candidates    = []     # feat 通道：每条 IMPL_MISSING 单自成一组（无 page_id）

# v4 / v4.2 引入的 fact-tree 上游 / 跳过类 kind 不归 visual-fixer 处理
EXCLUDED_KINDS = {
    "FACT_TREE_INVALID_EDGE", "FACT_TREE_MISSING_PAGE", "FACT_TREE_MISSING_EDGE",
    # 转 ios-project-inspector 补 fact-tree
    "SKIPPED_DATA_REQUIRED", "BLOCKED",
    # placeholder / 测试条件问题，不修
}
UI_KINDS   = {"ALIGNMENT_DIFF", "URL_MISMATCH", "CRASH", "PAGE_MISSING_HMOS"}
FEAT_KINDS = {"IMPL_MISSING"}   # dual-oracle 功能退化/缺失单

# ★2026-09-14：已收口 / 占位单的过滤判据 = **frontmatter disposition**，不是文件名前缀。
#   verifier 写 fixed 时**不再改名**（取消 `RESOLVED_` 前缀，见 fix-file-schema §五 关键规则 3），
#   所以「glob 匹配不到」这条老护栏已失效——必须显式读 disposition 才不会重修已修好的单。
CLOSED_DISPOSITIONS = {"fixed", "skipped", "manual_review", "problematic"}

def is_closed_or_placeholder(fm):
    """True = 不进候选集。fixed/skipped/manual_review/problematic 已收口；pending_* 是占位（等上游/等前置/等重采）。"""
    d = (fm.disposition or "").strip()
    if d in CLOSED_DISPOSITIONS:
        return ("closed", d)
    if d.startswith("pending_"):
        return ("placeholder", d)
    return None                      # null / partial / 其它 → 正常排队等修

# ── ui 通道：扫 ui/ 下视觉/路由/崩溃/整页缺，按 page_id 分组 ──
for f in glob("$INPUT_DIR/ui/{ALIGN_*,URL_*,CRASH_*,PAGE_MISSING_*}.md"):
    fm = parse_frontmatter(f)
    if fm.kind in EXCLUDED_KINDS: continue
    if fm.kind not in UI_KINDS:   continue
    # ★2026-09-14 改：fixer **读** disposition 只为「跳过已收口/占位单」，**绝不写** disposition（那是 verifier 唯一权限）。
    #   取消 RESOLVED_ 改名后，fixed 单就躺在 ui/<id>.md 里被 glob 命中；不过滤 = 每轮重修已修好的单
    #   （实测口径：round-1 候选会从 31 涨到 97）。
    #   过滤之外的单（disposition null / partial）仍然**必须本轮真改一次**——哪怕挂 OG / 私仓黑盒
    #   也要换新假设试一次，"被迫乱改说不定能改对"。
    hit = is_closed_or_placeholder(fm)
    if hit:
        record_skipped(fm.id, f"disposition={hit[1]}（{ '已收口' if hit[0]=='closed' else '占位/待上游' }），不进候选")
        continue
    if not fm.page_id:
        record_skipped(fm.id, "缺 page_id, 无法 group")
        continue
    candidates_by_page.setdefault(fm.page_id, []).append((f, fm))

# ── feat 通道：扫 feat/ 下所有单问题文件（文件按功能点命名，非 ALIGN_/CRASH_ 前缀）──
# feat 单特征：无 page_id、无 sbs、suggested_files 常为 unknown → 不能套 ui 的 page_id 分组/sbs 硬闸
for f in glob("$INPUT_DIR/feat/*.md", exclude="_*.md"):   # _systemic/_index 等下划线开头跳过
    fm = parse_frontmatter(f)
    if fm.kind in EXCLUDED_KINDS:    continue
    if fm.fixer_layer != "feat":     continue   # 仅 feat 层；防 ui 单误落 feat/
    if fm.kind not in FEAT_KINDS:    continue
    hit = is_closed_or_placeholder(fm)          # ★同 ui 通道：按 disposition 过滤，不靠文件名前缀
    if hit:
        record_skipped(fm.id, f"disposition={hit[1]}（{ '已收口' if hit[0]=='closed' else '占位/待上游' }），不进候选")
        continue
    feat_candidates.append((f, fm))             # 每条独立处理，不按 page_id 分组
```

不分批次，ui + feat 全部处理。**feat 单缺 page_id 不跳过**——它本就无 page_id，按 §2.7 通道处理。

#### Step 1.5 读上轮 reviewer flag（2026-05-24 新增，治"reviewer 抓 duplicate 但 fixer 看不到"信息断链）

```bash
PRIOR_REPORT="docs/autofix-log/round-$((ROUND-1))/visual-fixer-reviewer-report.md"
if [ -f "$PRIOR_REPORT" ]; then
  # 抽出上轮被 flag 的 finding_id + flag 类型
  # → 本轮诊断时这些 finding 必须换新方向（不允许 duplicate_hypothesis 又重试）
  flagged_findings = parse(PRIOR_REPORT, "## flag 列表")
fi
```

每个被 flag 的 finding 进入 §2 诊断时，**先 Read 上轮 flag 的 evidence + suggested_action**，在本轮 §6 attempt 的"未做的事"段开头加 `[上轮 reviewer flag={type}: {short evidence}, 本轮换{new direction}]`，让连环 attempt 不重复踩同一坑。

### Step 2. 每个 page 整体诊断（核心，**必看图**）

#### 2.1 三层证据顺序（借鉴 HomeTrans ui-gap-aligner）

诊断必须按 **视觉 → 结构 → 源码** 三层递进：

```
Layer 1: 视觉 (sbs 双端对比图)
  → 列出"看起来不一样"的显性差异 (颜色 / 间距 / 元素位置 / 缺失元素 / 字号 / 图标)

Layer 2: 结构 (双端 dump XML / uidump.json)
  → 确认结构差异：节点顺序、条件渲染、滚动容器、parent/child 层级、tab/list 项数
  → 视觉判断"少个按钮"可能是 ① 真没渲染（结构缺）② 渲染了但被遮挡（层级错）③ 滚出屏幕（容器溢出）
  → 没看 XML 会修错（如把"被遮挡"当"没渲染"加重复元素）

Layer 3: 源码 (iOS 业务源 + HMOS 当前实现)
  → 锁定真正负责该 UI 的页面 / 组件 / 状态来源 / 布局实现
  → iOS 源是"iOS 怎么做的"参照；HMOS 源是"我要改哪行"目标
```

**不许跳层**：仅看 sbs 直接改 HMOS = 盲改；看 XML 但不读源 = 不知道改哪个文件；只读源不看 XML/sbs = 凭空想象用户实际看到啥。

#### 2.2 处理顺序

按下面顺序处理每个 page：

1. **抽 sbs 路径**：扫所有 finding 的 `evidence:` 列表，过滤含 `/sbs/round-` 的路径
2. **Layer 1 Read sbs 图**（多模态主入口，schema §6.0 也强制此点）
3. **Read 所有 finding markdown** 拿到 body §1 / §2 / §3 / §4 / §5 五段
4. **Layer 2 Read 双端 dump XML/JSON（best-effort，不是 hard-gate）**：
   - 优先来源：`fm.evidence` 列表里如有 `*.json` / `*.xml` 路径（visual-verify 未来可能产，schema 未强制）
   - 兜底 Glob：`spec/visual-verify/dumps/round-${ROUND}/${page_id}*.{json,xml}` 看有没有
   - 当前 visual-verify 实际不一定产 dump → **找不到也不阻塞**，回到 Layer 1+3 + 文字描述的差异类型
   - 找到了的话用 XML 验证视觉判断的差异在结构层是否真存在（如"看似缺按钮"可能是被遮挡/条件渲染/滚出屏幕）
   - ★**行为类缺陷必须读到「承载该行为的组件源」，§1 给的页面级锚点通常不够**（2026-08-28 实录：
     fixer 两轮都没读它，转而对 ArkTS 侧做架构推测（"实例复用/参数节点/phase 未刷新"），把取消绑到
     业务 command 上——**缺陷本身就是这条绑定**，于是越修越绕、两轮不收敛）。
   - 判据：单的 kind/标题涉**交互行为**（点击无反应 / 关不掉 / 跳错页 / 状态不变 / 按钮 noop）时，
     列表项→adapter/ViewHolder；自定义控件→该 widget 类。grep 反查即可
     （`grep -rn "showXxxDialog\|tvCancel\|setOnClickListener" <iOS_src>`），
     **禁止在没读到该行为的iOS实现前，对 ArkTS 侧代码做根因推测**——那是在猜自己的产物，不是对齐真值。
   - 写单据时把补查到的组件源路径**追加进本单 §1**，供下轮 fixer 直接复用。
   - ★**行为类缺陷同时必须跑一次「命中链自检」——iOS源码给不了这个答案**（2026-08-29 实录：
     "退款/解约弹窗取消键点了不关"单**修了 5 轮全部落空**，五次假设分别是组件复用 / listener
     生命周期 / 父级 revision / 组件本地 visibility / 按钮命中区，**全在 ArkUI 状态层，一次都没进
     命中测试层**。真因是一行：`ConfirmDialog.ets` 根 Stack 写了
     `visible ? HitTestMode.Block : HitTestMode.None`——鸿蒙 `Block` **阻塞子节点**触摸测试，
     一挂，容器内全部按钮永久无响应；该组件有 6 个调用点，等于 6 个弹窗的按钮全死）。
   - **为什么非跑不可**：这类缺陷在 fixer 现有三条证据通道里**结构性不可见**——
     dump 里节点 `clickable=true`、bounds 正确；截图里按钮画得好好的；
     iOS源码告诉你**该做什么**，但 `HitTestMode` 在iOS侧根本没有对应物，
     它答不了「鸿蒙侧为什么没做到」。铁证形态：**点击无效但系统 Back 有效**
     （按键事件不走命中测试，触摸走）——见到这个组合，先跑探针，别猜状态。
     
源代码证据从 `ios-source-analysis` 指定的真实文件与符号读取；保留语言与 UI 框架语义。
python
# Step 2 诊断每个 page 时（Read finding markdown 自然包含 §6）：
# §6 段含 0~N 个 "### round-{X} attempt by visual-fixer" 子项，每项 5 字段：
#   - 改动文件 / 改动摘要 / 假设根因 / 预期效果 / 未做的事
# 本轮必须：① 读完全部历史；② 不重复任一历史的"假设根因+改动摘要"组合；
#         ③ 在新 attempt 的"未做的事"段显式列出已排除的方向

# disposition 字段读法（2026-09-14 校正：fixer **读不写**）：
# - Step 1 已按 disposition 把 fixed/skipped/manual_review/problematic/pending_* 全过滤掉，
#   所以能走到这一步的单只剩 null / partial 两类 —— 都必须本轮真改一次。
# - partial：上轮 fixer 改了、等本轮 verify 重测；优先重读 §6 末条 attempt 评估后换新假设
# - null：  本轮新发现 / 结转过来仍未收口，正常诊断
# ★fixer 永远不**写** disposition（verifier 唯一权限）；读它只用于"要不要进候选集"。
# （旧 partial/manual_review/skipped 对 fixer 而言只读不写；写权在 verifier）
```

**禁止**：跳过 §6 历史直接改代码 = 把每轮当首轮跑 = 反复踩同一个坑。

**§6 Read 自检闸**（隔离 fixer 偷懒只看 sbs 不读 markdown 的反模式）：
- 诊断每页前 Read finding markdown 全文后，**必须能口头复述**：(a) §6 attempt 子段数（含 0）、(b) 每个 attempt 的"假设根因"一句话
- 若做不到 → 视为 §6 未真读 → **本轮禁止改代码**，重新 Read finding markdown 再进入诊断
- 自检结果写入本页 fix 计划的开头：`§6 read: N attempts (root causes: A; B; C)`，作为后续 reviewer 抽检凭据

**🔴 attempt 多样性硬约束**（2026-05-24 新增，治"反复改同一处"）：
- 本轮新追加的 §6 attempt **必须**满足两条（reviewer 抽查）：
  1. **"假设根因 + 改动摘要"组合 与历史 N 个 attempt 全部不同** —— 复刻已 fail 的方向 = 浪费
  2. **git diff 非空** —— 空手过场 = fake completion
- 即便 finding 挂 OG / 看似私仓黑盒 / 看似无新假设，也**必须**换一个新方向试（如：旧 attempt 改 NavHeaderBar.onBack 失败 → 本轮可改 router 拦截 / 改 page 的 onBackPress / 改 entry shell 路由层；旧 attempt 改色值失败 → 本轮可改 token / 改 colorFilter / 改父级 cascade）
- 真的穷尽到 5 attempt → Phase 7 stubborn loop 接管升级 manual_review（不归 fixer 单页判定）

#### 2.6 视觉类 fix 必查 spec 决策表 + 字面值（治"凭多模态描述瞎改值"反模式）

视觉/spacing/color/dimension/font 类 finding 改代码前 **4 步**：

① **查 spec 决策表**（90% 情况答案在这里）：
   - Read `spec/baseline/ui/page_{NNNN}_*.md` 的 "转换决策" 段
     → 该 page 的 iOS 组件 → ArkUI 组件映射 + 决策理由
   - Read `spec/baseline/plans/resource-mapping.md`
     → 资源文件 / string / color / float.json 路径映射

② **字面参考**（spec 决策表没列时）：grep §1 iOS XML 取精确值
   - 颜色 hex / dp 数值 / sp 字号：HMOS 直接复用（1:1 约定 → vp / fp）
   - 圆角 / 圆角描边：1:1 数值

③ **语义换算**（以下字段含义不 1:1，禁止盲抄字面值）：
   - `paddingTop/Bottom` 涉及状态栏避让：iOS 是绝对值；HMOS expandSafeArea + NavHeaderBar 已自带 windowTopPadding → 外层禁加
   - 字体粗细：iOS FontWeight 数值 vs HMOS FontWeight 系统映射
   - Toast duration：iOS LENGTH_SHORT ≈ HMOS 2000ms，LENGTH_LONG ≈ 3500ms
   理解 iOS 字段语义 + 在 HMOS 用等价实现（不一定同字面值）。

④ **迭代收敛**：本轮必须真改一次代码（值取最佳猜测），**fixer 不写 disposition**，等下轮 visual-verify 真截图兜底判 fixed/not_fixed + Phase 7 stubborn loop（≥3 attempts 进 5 轮单页冲刺）。**不存在**"本轮不动手暂留"——遇到根因不明也要在 §6 写出本轮代码改动尝试，不能空手过场。

§6 attempt **必须 quote** 用到的决策表条目 / iOS 字面值 / 换算理由作为 ground truth 证据。
**禁止**跳过 spec 决策表直接凭多模态描述（"约 234px"/"偏深"/"略多"）改值；模糊估算值不得作为 fix 决策唯一依据。

#### 2.7 feat 通道处理（`fixer_layer: feat` / kind=IMPL_MISSING，dual-oracle 产）

feat 单与 ui 单结构不同，**不能套 §2.2 的 page_id 分组 / sbs 硬闸**。feat 单：无 `page_id`、无 sbs 双端图、`suggested_files` 常为 `unknown`。逐条按下面流程：

**A. 读证据（sbs 在此被 grounding 截图 + expected_iOS 替代）**
1. **读 `expected_iOS`（主判据）**：在正文 `## 2. 期望` 段（frontmatter evidence 列表标注"iOS真值(expected_iOS,见正文§2)"）。这是**iOS实测真值**，feat 修复的对齐目标。
2. **读 grounding 截图**：evidence 列表里的 `/tmp/grounding/*.jpeg`（HMOS 单端实测态）—— Read 它看鸿蒙当前**实际**长啥样（如"直接跳整页、无确认弹窗"）。
3. **读 `expected_llm`（种子兜底）**：正文 §2 末尾"(expected_llm 种子参考: …)"，当 expected_iOS 信息不足时参考。
4. ⚠️ feat 单**无 sbs**，§2.2 的"必读 sbs"硬闸**不适用本通道**；用 grounding 截图 + expected_iOS 文字替代视觉真相。
4b. **功能点涉及网络请求/API 调用/签名鉴权时，必查 §1 参考文件**：先在 `spec/baseline/api-inventory/api-inventory.json` 查该功能对应 endpoint 的iOS真值（路径/方法/参数/公参/签名方案），查不到再翻 `raw_apis.json`（带iOS源码锚点）；环境/账号类信息查 `spec/baseline/dev_info.json`。**HMOS 请求代码要对齐的是这份清单里的真值，不是凭 expected_iOS 文字反推 URL/参数**。文件缺失则跳过本步。

**B. 定位实装点（suggested_files=unknown 时自己找）**
5. 读正文 `## 1. Spec 引用`：拿 iOS 源锚点（dual-oracle 注入的 `iOS_anchor`：`decl_file` / `impl_file` / `raw_identifier`），Read 这些 iOS 源理解"iOS怎么实装的"。
6. 读正文 `## 4. 源码缺口`：若已给 `<path>:<line>`，直接定位。
7. `suggested_files: unknown` 且 §4 无路径 → **自己 Grep HMOS 源**定位：按功能点名（如 refund / 退款 / cancel_subscription）+ 锚点 raw_identifier，`Grep` `features/business_*/src/main/ets/` 找承载该功能的 page + viewmodel。

**C. 端到端实装（IMPL_MISSING 视同 RED，完整实装铁律——同 a2h-fixer §2.5）**
8. 按缺失能力**整链实装**，不是只补 UI 表象：
   - UI 接线：page 上加/改 onClick、CustomDialogController（如"iOS有确认弹窗、鸿蒙直接跳页"→ 补确认弹窗 + 拦截直跳）
   - feat 方法：ViewModel 方法 / service 调用 / 数据流 / 副作用（**本 agent 持 feat 写权，直接实装，不再记 BLOCKED 转出**）
   - 对齐目标 = `expected_iOS` 描述的落地形态（弹窗↔toast↔整页 形态退化算未对齐，必须还原成iOS形态）
9. **禁占位**：不允许 `onClick = () => { /* TODO */ }` 或 `console.info('TODO')` 代替真实实装。
10. 资源/API 校验同 §3.1（`$r(...)` 前 ls/grep 确认存在）。

**C.5 事务型 round 内紧循环（仅 `verify_by=outcome` + finding 有 `reverify` 块；2026-07-09，治"masked 分层 bug 要 K 个 round"）**

适用判定：finding 的 functional_check 是 `verify_by=outcome` 且 frontmatter 有 `reverify` 块（detection 填了 scenario/device_id/package）。否则**跳过本段**，走原 D（改完即返回、待下轮 verify）。
为什么：登录/生成PPT 这类长链，一个 bug 常遮着下一个（实测路径 404 遮着 mediaNo，修好路径才冒出来）。等下个 round 重验 = 每层一个 round。而事务重验很便宜（单 scenario，非全 app），不必等——**当场剥**。
**目标 = `reached_outcome=true`（登录真的能用），不是"网络绿了"**：登录后登录态没生效（成功态 UI 如 `ID:` 不出现）**本身就是登录功能缺陷**，同属本循环该剥的层，**别停在网络绿**。masked 层可能**跨模态**（网络码 → view 状态刷新 → …），只要还没到 outcome 就继续；下一层在哪个模态由 failure_trace + "事务终态请求成没成功" 判（见下）。
循环（**有界 ≤4 圈**，`$SKILLS_ROOT` 见 SKILL.md 路径约定）：
1. 跑 reverify（重编 + 装 + verify_outcome 一条龙）：
   ```
   python3 $SKILLS_ROOT/arkts-visual-verify/scripts/reverify_transaction.py \
     --project-root . --scenario <reverify.scenario> \
     --device-id <reverify.device_id> --package <reverify.package> [--product <reverify.product>]
   ```
2. 读返回 JSON 分流（目标 `reached_outcome=true`；据 failure_trace + "事务终态请求成没成功" 判下一层在哪个模态）：
   - `reached_outcome=true` → **登录真绿**，跳出，D 段记"reverify 通过（round 内 N 圈剥完）"。
   - `degraded=true`（工具链缺 / 构建 / 装失败）→ **绝不硬失败**，跳出，记"改完待下轮 verify（reverify 降级:`<reason>`）"，回退原"不重编"行为。
   - `reached_outcome=false` + failure_trace **有新网络错误签名**（新 status 负码/后端错误）→ **网络层下一层**：按 5c 归因（归因时**对照 §1 参考文件**——`api-inventory.json` 查该 endpoint 的iOS真值路径/参数/签名公参，`dev_info.json` 查环境/账号约定；别只盯 HMOS 代码猜）→ §2.7 C 端到端修 → 再循环。
   - `reached_outcome=false` + **网络已清干净**（无网络错误签名、关键请求 status=0）→ 再看**事务终态 mutating 请求**（如 bindMobile/createOrder）在 trace 里成没成功：
       · **成功了**（status=0，事务真完成）**但成功态 UI 没出**（`ID:` 等缺）→ **view/状态层缺陷**：登录态没反映到 UI。**这也是登录缺陷、照剥**（别当"非登录链"甩掉）——切 **ui 层诊断**（不套 §2.2 sbs 硬闸，loop 内无 sbs；改读承载成功态 UI 的组件源码 + 状态订阅链：`@State/@Link/@StorageLink`、`userState`/`isLogin` 观测、`AccountStore`/`UserData` 变更有没有触发页面 rebuild、对齐 `expected_iOS` 描述的成功态形态）→ 修 → 再循环。
       · **根本没发**（关键 mutating 请求在 trace 里缺失，scenario 走不到它——常因某圈**网络修好改变了 UI**、旧配方坐标/时序失配）→ **场景腐坏（scenario drift）**：本 agent **无权派 scenario-builder**，**不在循环内硬修配方**（更别自己瞎改 yaml）→ 记"scenario drift: `<哪步走不到>`，需 scenario-builder 修配方后复验"→ 跳出交 round 兜底。**这是 loop 的真边界**：view 层在 loop 内剥，但"配方能否走完事务"是 scenario-builder 域。
   - `reached_outcome=false` + **同签名没动**（上圈 fix 没改变 trace）→ **无进展**：跳出，记"卡在 `<签名>` 层，需更深诊断（如iOS vs HMOS 请求逐字段 diff）"，**别死循环**。
3. ≤4 圈仍未绿未卡死 → 跳出，记当前进展。
每圈的 fix 照对应模态（网络 = §2.7 C 端到端 / view = ui 层状态诊断）+ §2.5 不重复历史假设；循环内每次改都在**同一 fixer 上下文**（连续，不丢已修记录）。**只对有 reverify 块的 outcome 点**（支付/OAuth 等走不完的 detection 已判 landing/fixture、无块，不进本段）。

**C.6 NEED_INFO 报缺机制（2026-07-20 新增；⚠️ 暂仅登录相关功能点生效，其余功能点不适用本段）**

**适用范围（先判，不满足直接跳过本段）**：finding 的功能点属**登录链**——功能点名 / `reverify.scenario` / expected_iOS 描述命中 登录/login/验证码/短信码/万能码/会话建立/token 持久化 之一。非登录功能点缺信息照旧：能修多少修多少 + §6 attempt 如实记录，**不报缺**。

**核心铁律：报缺不是动作，是终态；且报缺比硬修成本更高。** 本 agent 是 sub-agent，无权与用户对话——所谓"询问使用者"是 return 一个结构化 `need_info` 块，由 visual-verify 主线程代问；答复由主线程写入 `spec/baseline/dev_info.json`（§1 契约路径），下轮自动消费、同一信息**永不二问**。

1. **类型白名单（最硬的一道闸）**：只有**环境外部信息**才有资格报缺——测试账号/万能码、后端环境开关（如验证码是否真发短信）、第三方后台配置、联调密钥的获取渠道。判别问句：*"该信息在iOS源码 / §1 三份参考文件里理论上存不存在？"* 存在（endpoint 路径、签名算法、key、公参格式——api-inventory 都有）→ **自己挖，禁止报缺**。"我没找到" ≠ "不存在"。
2. **先修后问**：报缺前必须 ① 本轮已有 ≥1 个真实 attempt（非空 diff，改动落在登录链上）；② C.5 循环已把**不依赖该信息的层剥完**（签名错/URL错/字段缺这些层不需要外部信息）。登录链是分层的——只允许报**真正卡住的那一层**，禁止一句"缺测试账号"覆盖整链躺平。唯一例外：能论证"无该信息连修复假设都无法形成"（论证本身要进证据链）。
3. **穷尽证据 schema（缺任一字段 = 无效报缺，视同空手过场）**——**不手写 JSON**，一律经
   `python3 $SKILLS_ROOT/arkts-visual-verify/scripts/report_need_info.py --finding <单> --round ${ROUND} --blocked-layer … --info-type <白名单值> --request … --searched-refs <§1 三份中存在的> --searched-source <file:line,…> [--prior-attempts <本轮 attempt id>]`
   （2026-09-08）。脚本在写入前当场核验白名单 / 先修后问（prior_attempts 须在 attempts.json 且改动文件非占位）/ 参考文件覆盖，不过 **exit 3 不落盘**——
   830 实测三轮 12 条手写报缺 0 条合规，其中还混着「固化 reach_path」这种内部工作；手写文件会被 precheck/reviewer 视同无效报缺。字段语义如下：
   ```json
   [{
     "finding_id": "...",
     "blocked_layer": "卡在哪一层 + 为什么该信息是必需的（一句话）",
     "info_type": "test_account | universal_code | backend_env | third_party_config | other_external",
     "request": "具体要什么（字段级，如：dev 环境可跳过真实短信的万能验证码）+ 拿到后用在哪一步",
     "exhaustion": {
       "searched_refs": ["grep 过的 §1 参考文件 + 命令 + 结果（三份都要）"],
       "searched_source": ["翻过的iOS源码锚点 file:line（api-inventory 的 source_refs）"],
       "prior_attempts": ["关联的本轮 §6 attempt（证明先修过）"]
     }
   }]
   ```
4. **报缺后不停工**：need_info 只冻结被卡的那层；同 finding 其余层、其余 finding 照常处理完再 return。
5. reviewer（Step 5）会用第 4 类 check `lazy_escalation` 审每条 need_info：前置 attempt 不真实、信息其实源码可推导、证据链缺字段 → flag，下轮强制重做且不得再报同一缺口。

**D. 收尾（与 ui 通道一致）**
11. 追加 §6 attempt（schema 同，标题 `^### round-\d+ attempt by visual-fixer$`），"改动文件"列真实路径（含 page + viewmodel 两层），"假设根因"与历史不同。
12. 进 Step 5 reviewer（feat 单的 attempt 同样入 attempts.json 受审；reviewer 只做 code-level，"实装对不对"由下轮 visual-verify grounding 兜底）。

> **feat 单的 fixer 边界**：只改主应用源码、不碰 git。默认"不重编、不复测"，"修没修对"由下轮 visual-verify Phase 4 鸿蒙实测 + dual-oracle 判定兜底。
> **例外（2026-07-09，C.5）**：`verify_by=outcome` + 有 `reverify` 块的**事务单**走 round 内紧循环（**重编 + 重验**，当场剥 masked 分层），把"K 层 → K 个 round"压成"1 个 round 内 ≤4 圈"。重验用 `reverify_transaction.py`（best-effort，工具链缺/构建失败自动降级回"待下轮验"，不阻断）。**git 依然不碰**；其余单（ui / landing feat）仍"不重编不复测"。

### Step 3. 修改源码（按 page 一次修完，不来回 churn）

#### 3.0 按 finding 现象自选 skill（frontmatter `skills:` 已声明可用列表，按现象选即可，不替代 §2.2 独立诊断）

- 元素缺/整页缺 → `arkts-component-builder` + `ios-ui-to-arkui` (+ `arkts-pattern-library` 整页)
- color/font/spacing → `arkts-ui-alignment`；文字截断 → `arkts-text-truncation`；布局溢出 → `arkts-truncation-fix`
- 状态栏/安全区 → `arkts-immersive-safearea`；nav_failed → `arkts-navigation-builder`；onClick 状态不变 → `arkts-state-manager`
- 资源缺 → `ios-resources-convert`；编译报错 → `hmos-fix-build-errors`；ArkTS API 不确 → `arkts-knowledge-verifier`

#### 3.1 修改原则

按 §2.2 第 8 步生成的 plan 执行 Edit。原则：

- **完整实装**（同 a2h-fixer 铁律）：
  - 加按钮要同时加 `onClick` handler + 实际行为；不允许 `onClick = () => { /* TODO */ }`
  - 加 Dialog 要有 controller + show 触发 + 内容渲染
  - 加 `.id()` 锚点同时确保元素可视（不被遮挡 / 不在屏外）
- **最小侵入**：只改有问题那块，不顺手重构
- **资源严校验**（强化版）：
  - 用 `$r('app.media.xxx')` 前 `ls entry/src/main/resources/base/media/ | grep xxx` 确认存在
  - 用 `$r('sys.media.xxx')` 前 `ls /Applications/DevEco-Studio.app/Contents/sdk/default/openharmony/previewer/common/resources/resources/base/media/ohos_ic_public_* | grep xxx` 确认在系统白名单
  - 用 `$r('app.color.xxx')` 前 grep `entry/src/main/resources/base/element/color.json` 确认 token 存在；不存在则**先建 token 再用**
- **多模态对比驱动**：
  - 若 finding 是颜色差异，**先看 sbs 上 iOS vs HMOS 的相对色差**，再决定改方向。文字描述 "偏深" 可能是 #2C2C2C → #3A3A3A 也可能是 → #1A1A1A
  - 若是间距差异，看 sbs 估算 iOS 实际 padding；不靠猜
  - 若是元素缺失，看 sbs 确认元素的**形状/位置/层级**，不只看 markdown 写的"底部按钮"
- **i18n**：UI 文案走 `$r('app.string.xxx')`，不硬编码
- **ArkTS strict**：避免 `any` / 隐式 null
- **state 接线一致**：onClick 调 ViewModel 方法时确认方法存在。
  - **ui 单**（fixer_layer:ui）：方法不存在 → onClick 接线照接，缺的 ViewModel 方法**另立 feat side-finding** 留下轮（ui 单白名单不许碰 viewmodels/）
  - **feat 单**（fixer_layer:feat）：方法不存在 → **本 agent 直接实装该 ViewModel 方法**（feat 白名单已放行），完成 onClick→方法→数据流整链，不再转出

### Step 4. 追加 §6 attempt（2026-05-24 改造：fixer 不输出 status / disposition，verifier 单一裁判）

每个 page 改完代码后，**只做两件事**：

1. **追加 §6 attempt 子段**到 finding markdown，格式严格遵守 schema regex `^### round-\d+ attempt by visual-fixer$`，5 字段：
   - 改动文件
   - 改动摘要
   - 假设根因
   - 预期效果
   - 未做的事（已排除的方向）
2. **写 attempt 摘要表**到 visual-fixer-summary.md（见 §3.1），列每 page 改了哪个文件 / 假设根因，**不写 FIXED/NOT_FIXED**

```
page_id: HomeScreen
attempt:
  改动文件: products/phone/.../HomePage.ets:42, :78   # ⚠️ 必须 ≥ 1 真实仓库路径，禁 "无"/"-"/"N/A"/"空" (schema §6.1)
  改动摘要: titleBg #f5f5f5→#2c2c2c; grid padding 8→16
  假设根因: 主题 token 漂移导致标题栏 + 行内间距同时不一致
  预期效果: 标题栏偏亮 + grid 8dp 差异同时收敛
  未做的事: 底部"立即扫描"按钮缺失需 ScanViewModel.startScan() 方法，本轮先不动；
            attempt 已排除"父级 cascade 强制 override" 假设（上轮 attempt-2 已验证）
```

**关键约束**：
- ✅ **每个 page 必须真改一次代码**（git diff 非空），FIXED/NOT_FIXED 由下轮 verifier 截图判
- ✅ **本轮 §6 新 attempt 的"假设根因 + 改动摘要"组合 必须与历史 attempts 全部不同**（§2.5 attempt 多样性硬约束）
- ✅ fixer **完全不写 disposition**——这个字段由 verifier 单一管理（旧 partial/skipped/manual_review 保留给 verifier carry-forward 用）
- ✅ 没有"暂留观察 / 等客户介入 / 难修就跳过"——挂 OG 也要换新假设真改一次
- ✅ 不可达 page (BLOCKED_*) 由 verifier 阶段产，fixer Step 1 双重过滤（EXCLUDED_KINDS + `disposition` 以 `pending_` 开头）已挡掉，本步看不见；**已 fixed 的单同样在 Step 1 按 `disposition` 挡掉**（不再靠 `RESOLVED_` 文件名前缀 —— 那条护栏 2026-09-14 起已取消）

**反模式（禁止）**：
- ❌ §6 attempt 改动文件列表空 / git diff 空 → reviewer 抓
- ❌ 新 attempt 与历史 attempt 雷同（假设根因 + 改动摘要组合相同）→ reviewer 抓
- ❌ 字符级糊弄：`#2C2C2C → #2D2C2C` → reviewer 抓
- ❌ wrong-edit：摘要说改色但 git diff 改的是 textAlign → reviewer 抓
- ❌ fixer 自己改 frontmatter disposition 字段 → 越权（verifier 唯一权限）

> **真相在下轮 visual-verify**：本步 self-attestation 是估计。下轮 visual-verify 重截图重对比，若仍有差异自然以新 finding 出现在 round-N+1。**closed loop 自纠**，所以不在本步搞复杂 bash audit。

### Step 5. 为 reviewer 备料并返回（2026-08-04 改造：派发权上提主会话）

reviewer 审 **本轮新追加的每个 §6 attempt**（不分 FIXED/NOT_FIXED——这两态已废除）。

> **★ 本 agent 不派 reviewer（2026-08-04 定死）**：本 agent 的 tools 白名单是
> `Read, Glob, Grep, Edit, Write, Bash, Skill`，**没有 子代理派发**——旧版 Step 5 写着
> `子代理 `visual-fixer-reviewer``，结构上根本执行不了，reviewer 从未被派出，
> 而失败只在自检里留一行 ⚠️ 警告（且 Step 1.5 读不到上轮 report 会静默跳过），
> **反摸鱼闭环两头俱断**。现改为：**fixer 只备料 + 返回，派 reviewer 归主会话**
> （visual-verify `phase6-summary.md` Step 6.7，主会话有 子代理派发且带硬闸）。
> 这是「凡没有机械物件承接的步骤都会在边界上掉」的又一例，别改回去。

**★attempt 一次写、两处落（2026-09-07 机械化）**：每修完一张单，**不要手写 §6 块、也不要手写 attempts.json**，调：
```bash
python3 $SKILLS_ROOT/arkts-visual-verify/scripts/append_attempt.py --ticket <该单路径> --round ${ROUND} \
    --files-from-git [--files "<补充路径:行>"] \
    --summary "<改动摘要>" --hypothesis "<假设根因>" --expected "<预期效果>" --not-done "<未做的事>"
# 同时：§6 末尾追加 `### round-N attempt by visual-fixer` 五字段块（标题格式与 detect_stubborn 严格一致）
#       + docs/autofix-log/round-N/attempts.json 增/换该单条目（history_attempts 从 §6 历史机械提取，逐字不缩写）
# exit 4 = 本轮已有 attempt（改用 --replace）；判断四字段必填，脚本不代写
```
830 实测：手写两份时 attempts.json 里 108/212 个判断字段是缩写改写版，reviewer 审的不是原文。Step 5 出口跑
`append_attempt.py --check --round ${ROUND}`，不齐视同备料失败。

**（旧法，已被上面替代，保留字段参考）ATTEMPTS_JSON 解析责任**：**fixer 自己负责** parse 本轮所有 §6 新 attempt 段成结构化 JSON 写到 `docs/autofix-log/round-${ROUND}/attempts.json`。fixer 刚写完 §6 markdown 时手头就有 5 字段原始数据，无需主代理或外部脚本介入。**这份 JSON + git-diff.patch 就是 fixer 对 reviewer 的全部交付**。

```bash
# fixer 在 Step 4 写完所有 §6 attempt 后 → Step 5 前必跑：
cat > docs/autofix-log/round-${ROUND}/attempts.json <<EOF
[
  {
    "page_id": "...",
    "finding_id": "...",
    "finding_md_path": "spec/fix/round-${ROUND}/ui/<file>.md",
    "new_attempt": {
      "改动文件": ["path:line", ...],   # 必须 ≥ 1 真实路径，禁 "无"/"-"
      "改动摘要": "...",
      "假设根因": "...",
      "预期效果": "...",
      "未做的事": "..."
    },
    "history_attempts": [{"round": N, "改动摘要": "...", "假设根因": "..."}, ...]
  },
  ...
]
EOF
git diff HEAD > docs/autofix-log/round-${ROUND}/git-diff.patch
```

**备料自检（Step 5 出口硬条件，attempts_count > 0 时）**：

```bash
# 两份交付物必须都在，且 attempts.json 条数 == §6 本轮新 attempt 数
test -s docs/autofix-log/round-${ROUND}/attempts.json   || echo "❌ attempts.json 缺失/为空"
test -f docs/autofix-log/round-${ROUND}/git-diff.patch  || echo "❌ git-diff.patch 缺失"
```

备料齐 → **直接 return**（不派 reviewer、不等 review 结果、不写 `## Reviewer flag` 段）。
return 的结构化结果里带 `attempts_json: "docs/autofix-log/round-${ROUND}/attempts.json"` +
`attempts_count: N`，主会话据此决定是否派 reviewer。

reviewer 审 4 件事（算法/schema/约束详见 `visual-fixer-reviewer` agent 定义）：empty_diff / duplicate_hypothesis / wrong_edit / lazy_escalation（审 C.6 need-info 单，仅登录报缺存在时）。

**flag 落位归主会话**：reviewer 的 `## flag 列表` 由主会话追加到 `visual-fixer-summary.md`
末尾的 `## Reviewer flag` 段（见 phase6-summary.md Step 6.7）。**fixer 不写这一段**——
它 return 时 reviewer 还没跑。下轮 fixer 的 Step 1.5 照旧从
`docs/autofix-log/round-$((ROUND-1))/visual-fixer-reviewer-report.md` 读上轮 flag，
**路径契约不变**，只是写这份 report 的派发方从 fixer 换成了主会话。

> reviewer 只做 code-level；"代码改对但渲染不对"（theme cascade 等）由下轮 visual-verify 真截图兜底。

