## 4. 写盘白名单（按 fixer_layer 双层门控）

**铁律：白名单按当前正在处理的单的 `fixer_layer` 选**——`ui` 单只许碰 ui 白名单，`feat` 单才放行 feat 白名单。不许"借着有 feat 单就顺手改 ui 单不该碰的 viewmodel"。

### 4.1 ui 白名单（`fixer_layer: ui` 单）

覆盖三种项目布局：单 entry / products+features 双结构 / 旧版 features 单结构：

```
# 通用 entry 结构（旧版项目）
entry/src/main/ets/{pages,components,widgets,router}/**
entry/src/main/ets/utils/{Theme,Color,Style}*.ets        # 仅 ALIGNMENT_DIFF
entry/src/main/resources/**/{element,media}/**

# products 壳工程 + features 业务模块结构（a2h 新项目，如 scan-a2h）
products/*/src/main/ets/{pages,components,widgets,router}/**
products/*/src/main/resources/**/{element,media}/**
features/business_*/src/main/ets/{pages,components,widgets,router}/**
features/business_*/src/main/ets/utils/{Theme,Color,Style}*.ets   # 仅 ALIGNMENT_DIFF
features/business_*/src/main/resources/**/{element,media}/**
components/module_*/src/main/ets/**                       # 公共 UI 组件包
components/module_*/src/main/resources/**
```

### 4.2 feat 白名单（`fixer_layer: feat` 单，2026-06-18 新增——独立工具模式全包 feat）

feat 单端到端实装常需**同时**改 view 层（接线）+ feat 层（业务方法）。所以 feat 单**同时持有 ui 白名单（4.1）+ 下面 feat 层路径**：

```
# 通用 entry 结构
entry/src/main/ets/{viewmodels,services,repository,database,preferences,models,data}/**

# products + features 业务模块结构（本项目 AIImage：feat 代码在 features/business_*）
features/business_*/src/main/ets/{viewmodels,services,model,models,repository,api,data}/**
products/*/src/main/ets/{viewmodels,services,repository,models,data}/**
components/module_*/src/main/ets/{viewmodels,services,model,models}/**
```

> ⚠️ feat 白名单**只对 `fixer_layer: feat` 单开放**。处理 `fixer_layer: ui` 单时这些 feat 层路径**仍然禁止**（缺的 ViewModel 方法另立 feat side-finding，见 §3.1 / §5）。

### 4.3 通用

```
# 摘要文件（fixer 自写）
docs/autofix-log/round-${ROUND}/visual-fixer-summary.md
```

永久禁止（任何项目布局、任何 fixer_layer）：

- ❌ 处理 `fixer_layer: ui` 单时碰 `**/ets/{viewmodels,services,repository,database,preferences,models,bean,api,data}/**`（那是 feat 单的活，ui 单不许）
- ❌ 任何 ohosTest 文件
- ❌ spec/ 任何内容
- ❌ AppScope / build-profile.json5 / oh-package.json5 / hvigorconfig.ts5
- ❌ git add / git commit / git stash / 任何 git 状态变更（修完代码落盘即返回，git 操作由上游统筹）
- ❌ 注释 `console.info('TODO')` 占位代替真实实装
- ❌ 加 `.id()` 但不接 onClick / 不让元素可视
- ❌ 用未确认存在的资源（`$r('app.media.xxx')` 不查就用）

> **路径解析约定**：派发方 prompt 提供 `PROJECT_ROOT` 绝对路径。所有 `${ROUND}` 占位符**由派发方在 prompt 中替换为具体数字**或通过 shell env `$ROUND` 注入；本 agent **不依赖占位符自动展开**。

